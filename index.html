<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOVE Beyond Bus Configurator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
// 主题：默认深色，用户选过的记在浏览器里。放在样式之前执行，避免先闪一下浅色
(function () {
  var t = 'dark';
  try { t = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div class="app" id="app">
  <header class="head">
    <h1 data-i18n="title">MOVE Beyond Bus Configurator</h1>
    <div id="ctxLine" class="ctx"></div>
    <div class="layouts" role="group" data-i18n-aria="aria.layouts">
      <span data-i18n="layouts">Layout</span>
      <div id="layouts" class="seg"></div>
    </div>
    <div class="layouts" role="group" data-i18n-aria="backplane">
      <span data-i18n="backplane">Backplane</span>
      <div id="backplanes" class="seg"></div>
    </div>
  </header>

  <aside class="lib">
    <div id="powerPanel" class="panel" hidden></div>
    <div id="libPanel" class="panel">
      <div class="libhead">
        <h2 data-i18n="library">Boards</h2>
        <div id="libFilters" class="chips" role="group" data-i18n-aria="aria.filters"></div>
      </div>
      <div id="libList" class="list"></div>
      <p id="libEmpty" class="note" data-i18n="filter.empty" hidden></p>
    </div>
    <div id="ifacePanel" class="panel" hidden>
      <h2 id="ifaceTitle"></h2>
      <div id="ifaceList" class="list"></div>
    </div>
  </aside>

  <main class="main">
    <div class="stage" id="stage">
      <div id="slotBanner" class="banner" aria-hidden="true"></div>
      <canvas id="cv" role="img" data-i18n-aria="aria.canvas"></canvas>
      <div id="slotMarks" class="marks"></div>
      <div id="marks" class="marks"></div>
      <div id="flowMarks" class="marks"></div>
      <div id="hoverCard" class="hovercard" hidden></div>
      <div class="tools">
        <span class="tipbox" data-i18n-tip="tip.power">
          <span id="layerSeg" class="seg" role="group" data-i18n-aria="aria.view">
            <button type="button" data-layer="layout" data-i18n="view.layout">Layout</button>
            <button type="button" data-layer="power" data-i18n="view.power">Power</button>
          </span>
        </span>
        <button id="undo" type="button" data-i18n-aria="aria.undo" disabled>↶</button>
        <button id="redo" type="button" data-i18n-aria="aria.redo" disabled>↷</button>
        <button id="rotL" type="button" data-i18n-aria="aria.rotL">⟲</button>
        <button id="rotR" type="button" data-i18n-aria="aria.rotR">⟳</button>
        <button id="resetView" type="button" data-i18n-aria="aria.reset">⌂</button>
        <button id="themeToggle" type="button"></button>
      </div>
    </div>
    <div class="dock">
      <div class="hint" id="hint"></div>
      <div class="strip" id="strip"></div>
      <dl class="stats" id="stats" style="margin:0"></dl>
    </div>
  </main>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
