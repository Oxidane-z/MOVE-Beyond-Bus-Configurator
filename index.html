<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOVE Beyond Bus 配置器</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div class="app">
  <header class="head">
    <h1>MOVE Beyond Bus 配置器</h1>
    <p>占位几何原型 · 7 槽背板</p>
  </header>

  <aside class="lib">
    <div id="libPanel" class="panel">
      <h2>板卡库</h2>
      <div id="libList" class="list"></div>
      <p class="note">几何、尺寸和功耗都是示例数据，真实 STEP 模型到位后替换。</p>
    </div>
    <div id="ifacePanel" class="panel" hidden>
      <h2 id="ifaceTitle">接口</h2>
      <div id="ifaceList" class="list"></div>
    </div>
  </aside>

  <main class="main">
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="卫星 slot card 系统的等轴测视图"></canvas>
      <div id="marks" class="marks"></div>
      <div class="tools">
        <button id="rotL" type="button" aria-label="向左旋转 90 度">⟲</button>
        <button id="rotR" type="button" aria-label="向右旋转 90 度">⟳</button>
        <button id="frameBtn" type="button" aria-pressed="true">框架</button>
      </div>
    </div>
    <div class="dock">
      <div class="hint" id="hint"></div>
      <div class="strip" id="strip"></div>
      <dl class="stats" id="stats" style="margin:0"></dl>
    </div>
  </main>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
